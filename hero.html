<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hero</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
}

html, body {
    width: 100%;
    overflow-x: hidden;
}

body {
    background: linear-gradient(135deg, #fbeaff, #eef3ff, #eaf7ff);
    color: #3a3a3a;
}

nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 40px;
    background: rgba(255, 255, 255, 0.65);
    backdrop-filter: blur(14px);
    box-shadow: 0 6px 25px rgba(0,0,0,0.05);
}

nav h1 {
    font-size: 20px;
    font-weight: 700;
    background: linear-gradient(90deg, #ff9ecb, #a88bff, #8fd3ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

nav ul {
    list-style: none;
    display: flex;
    gap: 22px;
}

nav ul li a {
    text-decoration: none;
    color: #6f5aa8;
    font-weight: 600;
}

nav ul li a:hover {
    color: #a88bff;
}

.hero {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 70px 40px;
    gap: 40px;
    flex-wrap: wrap;
}

.hero-text {
    flex: 1;
}

.hero-text h2 {
    font-size: 44px;
    font-weight: 800;
    background: linear-gradient(90deg, #ff9ecb, #a88bff, #8fd3ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 8px;
}

.hero-text h3 {
    font-size: 18px;
    color: #7a6aa8;
    margin-bottom: 15px;
}

.hero-text p {
    font-size: 15.5px;
    line-height: 1.8;
    max-width: 500px;
    color: #555;
    margin-bottom: 25px;
}

.hero-buttons {
    display: flex;
    gap: 12px;
}

.btn1, .btn2 {
    padding: 12px 22px;
    border-radius: 30px;
    font-weight: 600;
    text-decoration: none;
    font-size: 14px;
}

.btn1 {
    background: linear-gradient(135deg, #ff9ecb, #a88bff, #8fd3ff);
    color: white;
}

.btn2 {
    border: 2px solid #a88bff;
    color: #6f5aa8;
}

.btn2:hover {
    background: #a88bff;
    color: white;
}

.hero-image {
    flex: 1;
    display: flex;
    justify-content: center;
}

.hero-image img {
    width: 280px;
    height: 280px;
    border-radius: 50%;
    object-fit: cover;
    border: 6px solid rgba(168, 139, 255, 0.25);
}

@media (max-width: 768px) {
    nav {
        padding: 14px 20px;
        flex-direction: column;
        gap: 10px;
    }

    .hero {
        padding: 50px 20px;
        text-align: center;
        justify-content: center;
    }

    .hero-buttons {
        justify-content: center;
    }
}
</style>
</head>
    
<body>
<nav>
    <h1>Home</h1>
    <ul>
        <li><a href="hero.html">Home</a></li>
        <li><a href="aboutme.html">About Me</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="contacts.html">Contacts</a></li>
    </ul>
</nav>

<section class="hero">
    <div class="hero-text">
        <h2>JO-ANN D. BLANCO</h2>
        <h3>2nd Year BSIT Student</h3>

        <p>
        "Working with a file, every day, little by little, until the orchestra's collective qualities emerge."
        - James Levine
        </p>

        <div class="hero-buttons">
            <a href="projects.html" class="btn1">Projects</a>
            <a href="contacts.html" class="btn2">Contacts</a>
        </div>
    </div>

    <div class="hero-image">
        <img src="me.jpg" alt="Profile">
    </div>
</section>

</body>
</html>
