<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero</title>
</head>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
}

body {
    background: linear-gradient(135deg, #fff6fb, #f3f0ff, #f7fbff);
    color: #3a3a3a;
}

nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 60px;
    background: rgba(255, 255, 255, 0.7);
    backdrop-filter: blur(12px);
    box-shadow: 0 6px 20px rgba(0,0,0,0.05);
    border-radius: 0 0 20px 20px;
}

nav h1 {
    font-size: 22px;
    color: #a06cd5;
    font-weight: 700;
}

nav ul {
    list-style: none;
    display: flex;
    gap: 22px;
}

nav ul li a {
    text-decoration: none;
    color: #7b5ea7;
    font-weight: 600;
    position: relative;
    transition: 0.3s;
}

nav ul li a:hover {
    color: #c77dff;
}

.hero {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 90px 70px;
    gap: 50px;
    flex-wrap: wrap;
}

.hero-text {
    flex: 1;
}

.hero-text h2 {
    font-size: 42px;
    color: #8e5ebf;
    margin-bottom: 10px;
}

.hero-text h3 {
    font-size: 18px;
    color: #a98bc7;
    margin-bottom: 20px;
    font-weight: 500;
}

.hero-text p {
    font-size: 15.5px;
    line-height: 1.8;
    max-width: 520px;
    color: #555;
    margin-bottom: 30px;
}

.hero-buttons {
    display: flex;
    gap: 15px;
}

.btn1, .btn2 {
    padding: 12px 22px;
    border-radius: 30px;
    font-weight: 600;
    text-decoration: none;
    transition: 0.3s ease;
    font-size: 14px;
}

/* PRIMARY BUTTON */
.btn1 {
    background: linear-gradient(135deg, #c77dff, #bdb2ff);
    color: white;
    box-shadow: 0 8px 18px rgba(199, 125, 255, 0.3);
}

.btn1:hover {
    transform: translateY(-2px);
}

.btn2 {
    border: 2px solid #c77dff;
    color: #8e5ebf;
    background: transparent;
}

.btn2:hover {
    background: #c77dff;
    color: white;
}

.hero-image {
    flex: 1;
    text-align: center;
}

.hero-image img {
    width: 280px;
    height: 280px;
    object-fit: cover;
    border-radius: 50%;
    border: 6px solid #f3e8ff;
    box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    transition: 0.3s ease;
}

.hero-image img:hover {
    transform: scale(1.05);
}

@media (max-width: 768px) {
    nav {
        flex-direction: column;
        gap: 10px;
        padding: 15px 20px;
    }

    .hero {
        flex-direction: column;
        text-align: center;
        padding: 60px 20px;
    }

    .hero-text p {
        margin: 0 auto 25px;
    }

    .hero-buttons {
        justify-content: center;
    }
}
</style>
<body>
    <nav>
        <h1>Home</h1>

        <ul>
            <li><a href="hero.html">Home</a></li>
            <li><a href="aboutme.html">About Me</a></li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="contacts.html">Contacts</a></li>
        </ul>
    </nav>

    <section class="hero">
        <div class="hero-text">
            <h2>JO-ANN D. BLANCO</h2>

            <h3>2nd Year BSIT Student</h3>

            <p> "Working with a file, every day, little by little,
                until the orchestra's collective qualities emerge." 
                 -James Levine </p>
            <div class="hero-buttons">
                <a href="projects.html" class="btn1"> Projects </a>
                <a href="contact.html" class="btn2"> Contacts </a>
            </div>
        </div>

        <div class="hero-image">
            <img src="me.jpg" alt="Profile Picture">
        </div>
    </section>
</body>
</html>
