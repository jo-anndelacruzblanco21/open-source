<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Me</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
}

html, body {
    width: 100%;
    overflow-x: hidden;
}

body {
    background: linear-gradient(135deg, #fbeaff, #eef3ff, #eaf7ff);
    color: #3a3a3a;
}

.navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 40px;
    background: rgba(255, 255, 255, 0.65);
    backdrop-filter: blur(14px);
}

.navbar h1 {
    font-size: 20px;
    font-weight: 700;
    background: linear-gradient(90deg, #ff9ecb, #a88bff, #8fd3ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.navbar ul {
    list-style: none;
    display: flex;
    gap: 22px;
}

.navbar ul li a {
    text-decoration: none;
    color: #6f5aa8;
    font-weight: 600;
}

h1 {
    text-align: center;
    margin: 30px 0 10px;
    font-size: 34px;
    background: linear-gradient(90deg, #ff9ecb, #a88bff, #8fd3ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.about-container {
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
    padding: 40px 20px;
}

.about-card {
    background: rgba(255,255,255,0.75);
    width: 300px;
    padding: 22px;
    border-radius: 22px;
}

.about-card h2 {
    background: linear-gradient(90deg, #ff9ecb, #a88bff, #8fd3ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 10px;
}

.about-card p {
    font-size: 14.5px;
    line-height: 1.7;
    color: #555;
}

.skills {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 10px;
}

.skills span {
    background: #f3e8ff;
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 12px;
    color: #6f5aa8;
}

.skills span:hover {
    background: #a88bff;
    color: white;
}

@media (max-width: 768px) {
    .navbar {
        flex-direction: column;
        gap: 10px;
        padding: 14px 20px;
    }

    .about-container {
        padding: 30px 15px;
    }
}
</style>
</head>

<body>
<nav class="navbar">
    <h1>About Me</h1>
    <ul>
        <li><a href="hero.html">Home</a></li>
        <li><a href="aboutme.html">About Me</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="contacts.html">Contacts</a></li>
    </ul>
</nav>

<h1>About Me</h1>

<div class="about-container">

    <div class="about-card">
        <h2>Who Am I?</h2>
        <p>
        Hello! I am Jo-Ann D. Blanco, a 2nd Year BSIT student at Cavite State University – Imus Campus.
        I am passionate about web development and creative digital design.
        </p>
    </div>

    <div class="about-card">
        <h2>Skills</h2>
        <div class="skills">
            <span>HTML</span>
            <span>CSS</span>
            <span>MySQL</span>
            <span>Web Design</span>
            <span>Photography</span>
        </div>
    </div>

</div>

</body>
</html>
