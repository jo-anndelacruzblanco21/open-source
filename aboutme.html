<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About Me</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
}

html, body {
    width: 100%;
    overflow-x: hidden;
}

body {
    background: linear-gradient(135deg, #0f0c1a, #15102a, #0d1425);
    color: #e9e4f5;
}

.navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 24px 80px;
    background: rgba(20, 16, 35, 0.75);
    backdrop-filter: blur(14px);
}

.navbar h1 {
    font-size: 22px;
    font-weight: 700;
    background: linear-gradient(90deg, #ff9ecb, #a88bff, #8fd3ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.navbar ul {
    list-style: none;
    display: flex;
    gap: 35px;
}

.navbar ul li a {
    text-decoration: none;
    color: #cfc3ff;
    font-weight: 600;
}

h1 {
    text-align: center;
    margin: 60px 0 20px;
    font-size: 40px;
    background: linear-gradient(90deg, #ff9ecb, #a88bff, #8fd3ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.about-container {
    display: flex;
    justify-content: center;
    gap: 40px;
    flex-wrap: wrap;
    padding: 80px 40px;
}

.about-card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(168,139,255,0.2);
    padding: 30px;
    border-radius: 24px;
    width: 340px;
}

.about-card h2 {
    margin-bottom: 18px;
}

.about-card p {
    line-height: 2;
    color: #d7d0f2;
}

.skills {
    margin-top: 15px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
}

.skills span {
    padding: 8px 14px;
    border-radius: 20px;
}

@media (max-width: 768px) {
    .navbar {
        flex-direction: column;
        padding: 20px 25px;
        gap: 12px;
    }

    h1 {
        margin: 40px 0 10px;
    }

    .about-container {
        padding: 50px 20px;
        gap: 25px;
    }
}
</style>
</head>

<body>
<nav class="navbar">
    <h1>About Me</h1>
    <ul>
        <li><a href="hero.html">Home</a></li>
        <li><a href="aboutme.html">About Me</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="contacts.html">Contacts</a></li>
    </ul>
</nav>

<h1>About Me</h1>

<div class="about-container">

    <div class="about-card">
        <h2>Who Am I?</h2>
        <p>
            Hello! I am Jo-Ann D. Blanco, a 2nd Year BSIT student at Cavite State University – Imus Campus.
            I am passionate about web development and creative digital design.
        </p>
    </div>

    <div class="about-card">
        <h2>Skills</h2>
        <div class="skills">
            <span>HTML</span>
            <span>CSS</span>
            <span>MySQL</span>
            <span>Web Design</span>
            <span>Photography</span>
        </div>
    </div>

</div>

</body>
</html>
